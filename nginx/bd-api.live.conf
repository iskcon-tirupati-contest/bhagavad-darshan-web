# Default / IP / sslip HTTP
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 13-232-71-204.sslip.io 13.232.71.204 _;
    client_max_body_size 20m;

    location = /download { return 301 /download/; }
    location /download/ {
        alias /var/www/html/bd-media/download/;
        index index.html;
    }
    location /media/ {
        alias /var/www/html/bd-media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        types { application/vnd.android.package-archive apk; }
        access_log off;
    }
    location = /privacy {
        root /var/www/html/bd-media/legal;
        try_files /privacy.html =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300";
        add_header Content-Type "text/html; charset=utf-8";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# bdtirupati.com HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bdtirupati.com www.bdtirupati.com;
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://bdtirupati.com$request_uri;
    }
}

# bdtirupati.com HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bdtirupati.com www.bdtirupati.com;

    ssl_certificate     /etc/letsencrypt/live/bdtirupati.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bdtirupati.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location = /download { return 301 /download/; }
    location /download/ {
        alias /var/www/html/bd-site/download/;
        index index.html;
    }
    location /media/ {
        alias /var/www/html/bd-media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        types { application/vnd.android.package-archive apk; }
        access_log off;
    }
    location = /privacy {
        root /var/www/html/bd-site/legal;
        try_files /privacy.html =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300";
        add_header Content-Type "text/html; charset=utf-8";
    }

    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml;

    # The Express API owns exactly these prefixes; everything else is the static site.
    # The privacy policy now lives at /privacy; this old path is kept for existing links.
    location = /media/legal/privacy.html {
        return 301 https://bdtirupati.com/privacy;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
        root /var/www/html/bd-site;
        expires 7d;
        access_log off;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /var/www/html/bd-site;
        internal;
    }

    location / {
        root /var/www/html/bd-site;
        index index.html;
        try_files $uri $uri/ $uri.html =404;
    }
}

