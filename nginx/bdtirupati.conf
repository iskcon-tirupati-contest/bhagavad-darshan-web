# Reference snippet for bdtirupati.com (nginx site file: /etc/nginx/sites-enabled/bd-api).
# Applied on 16 Sep 2026; bd-api.live.conf holds the full config as deployed.
#
# The site is static; the Express API keeps every route under /v1/* and /health,
# so unmatched paths fall through to the proxy. Only the bdtirupati.com HTTPS
# block changed — the sslip.io and bare-IP servers stay pure API proxies because
# the Android app points at those.

# Inside the bdtirupati.com HTTPS server block, replace:
#
#   location / {
#       proxy_pass http://127.0.0.1:3000;
#       ...
#   }
#
# with:

location / {
    root /var/www/html/bd-site;
    index index.html;
    try_files $uri $uri/ $uri.html @api;
}

location = /privacy {
    root /var/www/html/bd-site/legal;
    try_files /privacy.html =404;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "public, max-age=300";
}

location @api {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# Existing /media/ and /download/ alias blocks stay unchanged.
